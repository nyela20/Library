version: '2.4'

services:
  ml_api:
    build:
      context: ./ML_ApiFast
      dockerfile: Dockerfile
    container_name: bu-ml-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ML_ApiFast:/app
    command: ["python", "-m", "uvicorn", "api_ml:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  mongo:
    image: mongo:6
    container_name: bu-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    depends_on:
      ml_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .            
      dockerfile: Dockerfile
    container_name: bu-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://nyelaRal:Nyela2025Mongo@cluster0.1awozsr.mongodb.net/libraryDB?retryWrites=true&w=majority
      - ML_API_URL=http://ml_api:8000
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - mongo                                      
    command: ["npm", "run", "start:dev"]

  frontend:
    build:
      context: ./bu-management-frontend
      dockerfile: Dockerfile
    container_name: bu-frontend
    ports:
      - "3001:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://backend:3000
    volumes:
      - ./bu-management-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "start-watch"]

volumes:
  mongo-data:
